# CS Executive Services — public website
# /etc/nginx/conf.d/www.csexecutiveservices.com.conf
#
# Cloudflare terminates TLS; nginx sees plain HTTP from cloudflared.
# Contact form POST → proxied to csexec-contact FastAPI on :8002.

# Markdown content negotiation (RFC 8288 alternate representation).
# A request with "Accept: text/markdown" for a page that has a real
# .md counterpart gets served that file instead of the .html one, at
# the same URL -- true content negotiation, not a separate /md/ path.
map $http_accept $wants_md {
    default           0;
    "~*text/markdown" 1;
}

# Only rewrite when a markdown counterpart genuinely exists: root and
# any *.html page. Everything else (css/js/api/robots.txt/etc.) is
# untouched -- $md_target stays empty and try_files falls through.
map "$wants_md:$uri" $md_target {
    default                        "";
    "~^1:/$"                       "/_md/index.md";
    "~^1:/(?<stem>.+)\.html$"      "/_md/$stem.md";
}

# Same applicability check, independent of Accept, used to advertise the
# alternate representation via Link header on the HTML response itself.
map $uri $md_link_header {
    default                  "";
    "~^/(.*\.html)?$"        "<$request_uri>; rel=\"alternate\"; type=\"text/markdown\"";
}

server {
    listen 80;
    server_name www.csexecutiveservices.com csexecutiveservices.com wrangler.csexecutiveservices.com;

    # Honeypot traps -> shared fail2ban jail (AI directive-ignorers + scanners).
    # Tailored to this static site + contact API. See ../docs or the dispatch
    # repo's docs/HONEYPOT_FAIL2BAN.md; requires the shared conf.d/00-honeypot.conf.
    include /etc/nginx/snippets/honeypot-website.conf;

    root /var/www/csexecutiveservices.com;
    index index.html;

    # Security headers (Cloudflare adds HSTS upstream)
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "strict-origin"   always;

    # Agent discovery (RFC 8288). llms.txt is the whole-site pointer; the
    # per-page alternate/text-markdown Link (added below, only on pages
    # that actually have a .md counterpart) is a real, IANA-registered
    # relation type -- not api-catalog/service-doc, which would be
    # dishonest here since this site has no API to catalog.
    add_header Link '</llms.txt>; rel="llms.txt"' always;
    add_header Link $md_link_header always;
    add_header Vary "Accept" always;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json text/markdown;

    # Branded 404 (2026-07-27). Two bugs fixed together, same root cause:
    #   1. Any genuinely unmatched path used to fall through to
    #      "/index.html" (see try_files in location / below, previously
    #      ended in "... /index.html" -- classic SPA fallback, wrong for a
    #      static multi-page site) and came back 200 with homepage
    #      content. An agent (or a person) hitting a bad link had no way
    #      to tell "page moved" from "page found."
    #   2. /.well-known/* -- the RFC 8615 PUBLIC discovery namespace agents
    #      probe for capabilities (MCP server card, agent-skills index,
    #      Web Bot Auth key directory) -- was being swallowed by the
    #      generic dotfile blocker below (location ~ /\.), returning 403.
    #      403 means "this exists, you can't have it." The correct signal
    #      for "the firm doesn't publish this capability" is 404, not 403
    #      and not a silent 200. Carved out below with a ^~ prefix match,
    #      which nginx honors ahead of the regex dotfile location
    #      regardless of file order, so it never reaches that block.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Agent/well-known discovery namespace (RFC 8615) -- public by design,
    # NOT a sensitive dotfile. Missing today: no MCP server card, no
    # agent-skills index, no Web Bot Auth key directory -- all intentional,
    # this firm has no public API and publishes no rates (see llms.txt).
    # A probe for any of them now gets a real 404. If a real .well-known
    # file is ever added it's served normally through the same block.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Static site — markdown negotiation first (see $md_target above; a
    # real internal redirect is required here, not a try_files candidate,
    # since try_files only stats a literal path and never re-enters
    # location matching for its intermediate arguments).
    location / {
        if ($md_target != "") {
            rewrite ^ $md_target last;
        }
        try_files $uri $uri/ =404;
    }

    # Internal target for negotiated markdown responses. Not directly
    # reachable -- only entered via $md_target from location / above.
    location ^~ /_md/ {
        internal;
        alias /var/www/csexecutiveservices.com/;
        types { text/markdown md; }
        default_type text/markdown;
        add_header Vary "Accept" always;
    }

    # Contact form API — fixes the 405 Method Not Allowed
    location /api/contact {
        proxy_pass         http://127.0.0.1:8002/api/contact;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # CORS pre-flight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://www.csexecutiveservices.com";
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            return 204;
        }
    }

    # Contact API healthz (internal only)
    location /api/healthz {
        proxy_pass http://127.0.0.1:8002/healthz;
        allow 127.0.0.1;
        allow 100.64.0.0/10;   # Tailscale range
        deny all;
    }

    # Block dot-files (everything EXCEPT /.well-known/, which is carved
    # out above -- that location's ^~ prefix match wins before nginx ever
    # reaches this regex, regardless of the order they appear in this file).
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/csexec-www-access.log;
    error_log  /var/log/nginx/csexec-www-error.log;
}
