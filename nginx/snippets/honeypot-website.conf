# snippets/honeypot-website.conf -- honeypot traps for the marketing site.
# `include` inside the www server{} block. Logs the real client IP to the SHARED
# /var/log/nginx/honeypot.log and drops the connection (444); the existing
# fail2ban jail (nginx-honeypot-corporatetraveldc) bans on the first hit.
#
# Tailored to a STATIC marketing site + tiny contact API:
#  - CMS / admin-panel bait (the site runs on none of these -> any hit is a probe)
#  - generic scanner bait (dotfiles, backups, db tools)
#  - (a)-category AI decoy paths, declared Disallow in www/robots.txt + www/llm.txt
# Deliberately NO /api/ trap: /api/contact and /api/healthz are REAL endpoints.
# robots.txt/llm.txt are served as real static files (NOT overridden here), so
# SEO/crawl directives stay intact -- only the decoy PATHS are trapped.
#
# Requires the shared http-context pieces from the dispatch repo's
# nginx/conf.d/00-honeypot.conf (log_format `honeypot` + $honeypot_addr map);
# it's one nginx instance, so that global definition covers this vhost too.

# --- (a) AI-crawler / directive-ignoring traps (forbidden in robots.txt/llm.txt) ---
location ^~ /ai-agents-keep-out/    { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /internal-do-not-index/ { access_log /var/log/nginx/honeypot.log honeypot; return 444; }

# --- (b) CMS / admin-panel bait (this static site runs on none of these) ---
location = /wp-login.php   { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /wp-config.php  { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /wp-admin      { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /wp-content    { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /wp-includes   { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /wp-json       { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /xmlrpc.php     { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /administrator { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /admin.php      { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /user/login    { access_log /var/log/nginx/honeypot.log honeypot; return 444; }

# --- (b) generic scanner bait (dotfiles, db tools, backups, source leaks) ---
location = /.env           { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /.git          { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /.svn          { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /.aws          { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /.htpasswd      { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /.DS_Store      { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /phpmyadmin    { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /phpMyAdmin    { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /pma           { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /adminer.php    { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /config.php     { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /vendor/       { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location ^~ /cgi-bin/      { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /backup.sql     { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
location = /shell.php      { access_log /var/log/nginx/honeypot.log honeypot; return 444; }
